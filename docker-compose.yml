services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: pubmed_rag
    ports:
      - "5433:5432"   # 5433 on the host so a local Postgres on 5432 isn't disturbed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d pubmed_rag"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
